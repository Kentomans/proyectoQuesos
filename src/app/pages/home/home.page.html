<ion-header>
  <ion-toolbar class="ion-text-center">
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="app-page home-page">
    <section class="content-shell hero-section" aria-labelledby="home-title">

        <div class="brand-holes">
          <span class="hole hole-1"></span>
          <span class="hole hole-2"></span>
          <span class="hole hole-3"></span>
        </div>
        <span class="brand-icon">🧀</span>

      <h1 id="home-title" class="page-title">Cheese Calculator</h1>

      <div class="divider-row">
        <span class="divider-line"></span>
        <span class="divider-dot"></span>
        <span class="divider-line"></span>
      </div>

      <div class="action-stack">
        <ion-button expand="block" routerLink="/calculation">
          <ion-icon name="calculator-outline" slot="start"></ion-icon>
          Comenzar
        </ion-button>
        <ion-button class="link-button" fill="outline" expand="block" routerLink="/help">
          <ion-icon name="help-circle-outline" slot="start"></ion-icon>
          Ayuda
        </ion-button>
      </div>

      <div class="info-chips">
        <div class="chip">
          <span class="chip-icon">🥛</span>
          <span class="chip-label">Litros de leche</span>
        </div>
        <div class="chip">
          <span class="chip-icon">🧂</span>
          <span class="chip-label">Sal exacta</span>
        </div>
        <div class="chip">
          <span class="chip-icon">🫙</span>
          <span class="chip-label">Cuajo preciso</span>
        </div>
      </div>

    </section>
  </main>
</ion-content>
