<ion-header>
  <ion-toolbar>
    <ion-title>Cheese Calculator</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="app-page home-page">
    <section class="content-shell hero-section" aria-labelledby="home-title">
      <div class="brand-mark" aria-label="Marca visual de Cheese Calculator">
        <span>CHEESE</span>
      </div>

      <h1 id="home-title" class="page-title">Cheese Calculator</h1>
      <p class="page-copy">
        Calcula de forma rapida la sal y el cuajo necesarios para producir queso a partir de los litros de leche ingresados.
      </p>

      <div class="action-stack">
        <ion-button expand="block" routerLink="/calculation">Comenzar</ion-button>
        <ion-button class="link-button" fill="clear" expand="block" routerLink="/help">Ayuda</ion-button>
      </div>
    </section>
  </main>
</ion-content>
