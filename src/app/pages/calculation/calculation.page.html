<ion-header>
  <ion-toolbar>
    <ion-title>Calculo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="app-page">
    <section class="content-shell calculation-section" aria-labelledby="calculation-title">
      <div>
        <h1 id="calculation-title" class="page-title">Ingredientes</h1>
        <p class="page-copy">Ingresa los litros de leche para calcular las cantidades proporcionales.</p>
      </div>

      <form class="section-panel form-panel" [formGroup]="calculationForm" (ngSubmit)="calculate()" novalidate>
        <ion-item lines="none">
          <ion-label position="stacked">Litros de leche</ion-label>
          <ion-input
            type="number"
            inputmode="decimal"
            min="0.01"
            step="0.01"
            placeholder="Ejemplo: 10"
            formControlName="milkLiters"
            aria-describedby="milk-liters-error"
          ></ion-input>
        </ion-item>

        <p
          id="milk-liters-error"
          class="validation-message"
          *ngIf="milkLitersControl.invalid && (milkLitersControl.touched || submitted)"
        >
          Ingresa un numero mayor a 0.
        </p>

        <ion-button type="submit" expand="block">Calcular ingredientes</ion-button>
      </form>

      <ion-button class="link-button" fill="clear" expand="block" routerLink="/help">Ver ayuda</ion-button>
    </section>
  </main>
</ion-content>
